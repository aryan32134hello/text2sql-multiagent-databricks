<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Text2SQL Assistant</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel-bg: #ffffff;
    --sidebar-bg: #eceef1;
    --border: #eee;
    --text: #1a1a1a;
    --assistant-bg: #f1f1f3;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --input-border: #ddd;
    --muted: #888;
    --accent: #2563eb;
    --accent-disabled: #a5b4d0;
    --hover: #e3e5e9;
    --active: #dde1e8;
  }

  [data-theme="dark"] {
    --bg: #16171b;
    --panel-bg: #1e1f24;
    --sidebar-bg: #101114;
    --border: #2c2d33;
    --text: #e8e8ea;
    --assistant-bg: #2a2b31;
    --user-bg: #3b82f6;
    --user-text: #ffffff;
    --input-border: #3a3b42;
    --muted: #9a9aa2;
    --accent: #3b82f6;
    --accent-disabled: #3f4657;
    --hover: #1c1d22;
    --active: #26272d;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .layout {
    width: 100%;
    max-width: 950px;
    height: 85vh;
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }

  /* --- Sidebar --- */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }

  .newChatBtn {
    margin: 14px;
    padding: 10px;
    border: 1px solid var(--input-border);
    background: var(--panel-bg);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
  }
  .newChatBtn:hover { background: var(--hover); }

  .convoList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .convoItem {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
    margin-bottom: 2px;
  }
  .convoItem:hover { background: var(--hover); }
  .convoItem.active { background: var(--active); font-weight: 600; }

  /* --- Main chat panel --- */
  .app {
    flex: 1;
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #themeToggle {
    background: none;
    border: 1px solid var(--input-border);
    color: var(--text);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 14px;
  }

  .user {
    align-self: flex-end;
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .assistant {
    align-self: flex-start;
    background: var(--assistant-bg);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .route-tag {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
    display: block;
  }

  .thinking {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    font-style: italic;
  }

  form {
    display: flex;
    padding: 14px;
    border-top: 1px solid var(--border);
    gap: 8px;
  }

  input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--panel-bg);
    color: var(--text);
  }

  input:focus { outline: none; border-color: var(--accent); }

  button[type="submit"] {
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }

  button[type="submit"]:disabled { background: var(--accent-disabled); cursor: not-allowed; }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <button class="newChatBtn" id="newChatBtn">+ New Chat</button>
    <div class="convoList" id="convoList"></div>
  </div>

  <div class="app">
    <header>
      <span>Text2SQL / RCA Assistant</span>
      <button id="themeToggle" type="button">🌙 Dark</button>
    </header>
    <div id="chat"></div>
    <form id="form">
      <input id="question" type="text" placeholder="Ask about sales, revenue, or machine failures..." autocomplete="off" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
  const BACKEND_URL = "https://text2sql-multiagent-databricks.onrender.com";
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const themeToggle = document.getElementById("themeToggle");
  const newChatBtn = document.getElementById("newChatBtn");
  const convoList = document.getElementById("convoList");

  let conversationId = localStorage.getItem("activeConversationId") || crypto.randomUUID();
  localStorage.setItem("activeConversationId", conversationId);

  // --- Theme toggle ---
  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
    localStorage.setItem("theme", theme);
  }
  setTheme(localStorage.getItem("theme") || "light");
  themeToggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
  });

  // --- Chat rendering ---
  function addMessage(text, sender, routeTag) {
    const el = document.createElement("div");
    el.className = "msg " + sender;
    el.textContent = text;
    if (routeTag) {
      const tag = document.createElement("span");
      tag.className = "route-tag";
      tag.textContent = "route: " + routeTag;
      el.appendChild(tag);
    }
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function clearChat() {
    chat.innerHTML = "";
  }

  // --- Sidebar: load conversation list ---
  async function loadConversations() {
    try {
      const res = await fetch(BACKEND_URL + "/conversations");
      const conversations = await res.json();
      convoList.innerHTML = "";
      conversations.forEach(c => {
        const item = document.createElement("div");
        item.className = "convoItem" + (c.conversation_id === conversationId ? " active" : "");
        item.textContent = c.title || "New conversation";
        item.title = c.title;
        item.addEventListener("click", () => switchConversation(c.conversation_id));
        convoList.appendChild(item);
      });
    } catch (err) {
      console.error("Failed to load conversations:", err);
    }
  }

  // --- Switch to an existing conversation: fetch its history and render it ---
  async function switchConversation(id) {
    conversationId = id;
    localStorage.setItem("activeConversationId", id);
    clearChat();

    try {
      const res = await fetch(BACKEND_URL + "/conversations/" + id);
      const messages = await res.json();
      messages.forEach(m => {
        addMessage(m.question, "user");
        addMessage(m.answer, "assistant", m.route);
      });
    } catch (err) {
      console.error("Failed to load conversation:", err);
    }

    highlightActive();
  }

  function highlightActive() {
    document.querySelectorAll(".convoItem").forEach(el => el.classList.remove("active"));
  }

  // --- New chat ---
  newChatBtn.addEventListener("click", () => {
    conversationId = crypto.randomUUID();
    localStorage.setItem("activeConversationId", conversationId);
    clearChat();
    loadConversations();
    input.focus();
  });

  // --- Ask ---
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;

    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking";
    thinkingEl.textContent = "Thinking...";
    chat.appendChild(thinkingEl);
    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch(BACKEND_URL + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, conversation_id: conversationId })
      });

      if (!response.ok) throw new Error("Server error: " + response.status);

      const data = await response.json();
      thinkingEl.remove();
      addMessage(data.answer, "assistant", data.route);
      loadConversations(); // refresh sidebar so a brand-new conversation shows up with its title
    } catch (err) {
      thinkingEl.remove();
      addMessage("Something went wrong: " + err.message, "assistant");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  // --- On page load: restore the active conversation's history, and populate the sidebar ---
  (async function init() {
    await loadConversations();
    if (conversationId) {
      // only load history if this conversation actually has messages already
      try {
        const res = await fetch(BACKEND_URL + "/conversations/" + conversationId);
        const messages = await res.json();
        if (messages.length > 0) {
          messages.forEach(m => {
            addMessage(m.question, "user");
            addMessage(m.answer, "assistant", m.route);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }
  })();
</script>

</body>
</html>
