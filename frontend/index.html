<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Text2SQL Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    margin: 0;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .app {
    width: 100%;
    max-width: 700px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 85vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 16px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: #f1f1f3;
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }
  .route-tag {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
    display: block;
  }
  .thinking {
    align-self: flex-start;
    color: #888;
    font-size: 13px;
    font-style: italic;
  }
  form {
    display: flex;
    padding: 14px;
    border-top: 1px solid #eee;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: #2563eb; }
  button {
    padding: 10px 18px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #a5b4d0; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app">
  <header>Text2SQL / RCA Assistant</header>
  <div id="chat"></div>
  <form id="form">
    <input id="question" type="text" placeholder="Ask about sales, revenue, or machine failures..." autocomplete="off" />
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
  const BACKEND_URL = "https://text2sql-multiagent-databricks.onrender.com";
  const conversationId = crypto.randomUUID();
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender, routeTag) {
    const el = document.createElement("div");
    el.className = "msg " + sender;
    el.textContent = text;
    if (routeTag) {
      const tag = document.createElement("span");
      tag.className = "route-tag";
      tag.textContent = "route: " + routeTag;
      el.appendChild(tag);
    }
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;

    const thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking";
    thinkingEl.textContent = "Thinking...";
    chat.appendChild(thinkingEl);
    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch(BACKEND_URL + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, conversation_id: conversationId })
      });

      if (!response.ok) throw new Error("Server error: " + response.status);

      const data = await response.json();
      thinkingEl.remove();
      addMessage(data.answer, "assistant", data.route);
    } catch (err) {
      thinkingEl.remove();
      addMessage("Something went wrong: " + err.message, "assistant");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
